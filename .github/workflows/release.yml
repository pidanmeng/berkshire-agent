name: Release

# 仅当打 v* 版本 tag（push tags）时自动打包并发布到 GitHub Release；
# 同时也支持手动触发（workflow_dispatch），方便手动发包。
# 不再监听 main 分支：main 合并不会再产生「草稿 Release」，从而保证
# 发布页一定出现可公开下载的安装包链接（草稿不会显示在公开 Releases 界面）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # macOS 双架构：同一平台跑两次，分别产出 arm64 / x86_64 安装包。
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 拉取完整历史 + 全部 tag，供下方生成「本次与上一版本之间」的提交明细（默认浅克隆拿不到前后 tag 与区间日志）。
          fetch-depth: 0

      # 生成 Release 正文：收集「上一版本 tag..当前版本」之间的所有 commit，写入步骤输出供 tauri-action 使用。
      # - 当前版本：由触发本次 release 的 GITHUB_REF_NAME 提供（tag 触发时即 v<版本>）。
      # - 上一版本：取存在的历史 v* tag 中版本号最大的那个（git --sort=-version:refname）。
      # - workflow_dispatch（非 tag）时没有「当前 tag」，则列出到最近一个 v* tag 之后的提交，标题用分支名兜底。
      - name: Prepare release body (commits since previous tag)
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_REF="${GITHUB_REF_NAME}"
          PREV_TAG="$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')"

          if [[ -n "${PREV_TAG:-}" ]]; then
            RANGE="${PREV_TAG}..${CURRENT_REF}"
            RANGE_TEXT="对比上一版本 \`${PREV_TAG}\`（${RANGE}）"
            COMMITS="$(git log --pretty=format:'- `%h` %s' "${RANGE}")"
          else
            RANGE_TEXT="无上一版本可对比，列出历史全部提交"
            COMMITS="$(git log --pretty=format:'- `%h` %s')"
          fi

          COUNT="$(printf '%s\n' "${COMMITS}" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"

          DELIM="CHANGELOG_EOF_${RANDOM}_${RANDOM}"
          {
            echo "release_body<<${DELIM}"
            echo "## berkshire-agent ${CURRENT_REF}"
            echo ""
            echo "自动生成于 tag 触发的 CI 流水线。"
            echo "（由 .github/workflows/release.yml 构建并上传，正式发布，含各平台安装包下载。）"
            echo ""
            echo "### 本次发版包含的提交"
            echo ""
            echo "${RANGE_TEXT}，共 ${COUNT} 条提交："
            echo ""
            printf '%s\n' "${COMMITS}"
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Linux system dependencies (webkit2gtk, etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/berkshire-agent/src-tauri -> target'

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            bun.lock
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Sync dependencies (bun monorepo)
        run: bun install --frozen-lockfile

      # tauri-action：构建本机安装包并上传到 GitHub Release。
      # - 4 个 matrix job 共用同一个 tag（v__VERSION__）与同一个 release：
      #   release 已存在时，其余 job 只把各自资产 append 到该 release，不整体覆盖。
      #   诚实标注（钉在 tauri-apps/tauri-action@v0，即 v0.6.2）：首次为某个新 tag
      #   建 release 时存在窄竞态——两个 job 几乎同时 getReleaseByTag 拿 404 后都调
      #   createRelease，后到者会收到 422 而该 job 失败；此窗口需重跑该 job 兜底。
      #   上方 concurrency 组用于防止同版本重复发布时的新一轮 run 相互干扰，
      #   并不序列化同一次 run 内 4 个 build job 的首次创建。
      # - releaseDraft: false + prerelease: false → 直接发布正式 Release，
      #   公开 Releases 界面立刻能看到并下载各平台安装包（解决原先只出草稿、
      #   页面上没有下载链接的问题）。
      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # 自动使用 package.json / Cargo.toml 中的版本
          releaseName: 'berkshire-agent v__VERSION__'
          releaseBody: '${{ steps.changelog.outputs.release_body }}'
          releaseDraft: false
          prerelease: false
          projectPath: './apps/berkshire-agent'
          args: ${{ matrix.args }}
